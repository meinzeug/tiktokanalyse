[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tiktokanalyse"
version = "0.1.0"
description = "TikTok-Videostatistiken live im Terminal verfolgen"
requires-python = ">=3.10"
dependencies = ["rich>=13,<15"]

[project.scripts]
analysiere = "tiktokanalyse:main"
analysierekanal = "kanalanalyse:main"

[tool.setuptools]
py-modules = ["tiktokanalyse", "kanalanalyse"]
